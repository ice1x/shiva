# Shiva's own review policy — the per-repo override this repo ships, and a
# worked example of the format a target repository copies.
#
# The shipped default provider is a free, local, keyless Ollama, which a GitHub
# runner cannot reach. Running as a GitHub Action therefore needs a hosted
# provider plus the SHIVA_LLM_API_KEY secret.
llm:
  provider: openai
  model: gpt-4o-mini

conventions: |
  Decisions live in src/shiva_agent/ as pure, side-effect-free functions; I/O
  (network, GitHub, the LLM call) lives in scripts/ and action.py. Do not
  suggest moving network calls into the pure modules.
  Every change ships with tests; the suite must stay runnable without network.
